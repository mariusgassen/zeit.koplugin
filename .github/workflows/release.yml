name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        run: |
          mkdir -p dist/zeit.koplugin
          cp main.lua zeitapi.lua _meta.lua README.md LICENSE dist/zeit.koplugin/
          cd dist
          zip -r zeit.koplugin.zip zeit.koplugin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeit.koplugin
          path: dist/zeit.koplugin.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zeit.koplugin.zip
